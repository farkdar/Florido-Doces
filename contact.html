<!-- =======================
   SEÇÃO: CONTATO
   ======================= -->
<div class="container-fluid contact position-relative px-5" style="margin-top: 90px;">
    <div class="container">

        <!-- Cards de contato -->
        <div class="row g-5 mb-5">

            <!-- Card: Atendimento -->
            <div class="col-lg-4 col-md-6">
                <div class="bg-primary border-inner text-center text-white p-5 h-100">
                    <i class="bi bi-geo-alt fs-1 text-white" aria-hidden="true"></i>
                    <h6 class="text-uppercase my-2">Atendimento</h6>
                    <span>Encomendas para festas, eventos e momentos especiais</span>
                </div>
            </div>

            <!-- Card: E-mail -->
            <div class="col-lg-4 col-md-6">
                <div class="bg-primary border-inner text-center text-white p-5 h-100">
                    <i class="bi bi-envelope-open fs-1 text-white" aria-hidden="true"></i>
                    <h6 class="text-uppercase my-2">Envie um e-mail</h6>
                    <a href="mailto:floridodoces@gmail.com" class="text-white">
                        floridodoces@gmail.com
                    </a>
                </div>
            </div>

            <!-- Card: WhatsApp -->
            <div class="col-lg-4 col-md-6">
                <div class="bg-primary border-inner text-center text-white p-5 h-100">
                    <i class="bi bi-whatsapp fs-1 text-white" aria-hidden="true"></i>
                    <h6 class="text-uppercase my-2">Fale pelo WhatsApp</h6>
                    <a href="https://wa.me/5544999954447" target="_blank" class="text-white">
                        +55 (44) 9 9995-4447
                    </a>
                </div>
            </div>
        </div>

        <!-- Formulário de contato centralizado -->
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="text-center mb-4">
                    <h4 class="text-uppercase text-white">Faça sua encomenda</h4>
                    <p class="text-white mb-0">
                        Preencha as informações abaixo e fale conosco diretamente pelo WhatsApp.
                    </p>
                </div>

                <form id="formContato" onsubmit="enviarWhatsApp(event)">
                    <div class="row g-3">

                        <!-- Nome -->
                        <div class="col-sm-6">
                            <input type="text" class="form-control bg-light border-0 px-4" name="nome" id="nome"
                                placeholder="Seu nome" aria-label="Seu nome" style="height: 55px;" required>
                        </div>

                        <!-- E-mail -->
                        <div class="col-sm-6">
                            <input type="email" class="form-control bg-light border-0 px-4" name="email" id="email"
                                placeholder="Seu e-mail" aria-label="Seu e-mail" style="height: 55px;">
                        </div>

                        <!-- Assunto -->
                        <div class="col-sm-12">
                            <input type="text" class="form-control bg-light border-0 px-4" name="assunto"
                                id="assunto" placeholder="Assunto da mensagem" aria-label="Assunto"
                                style="height: 55px;" required>
                        </div>

                        <!-- Mensagem -->
                        <div class="col-sm-12">
                            <textarea class="form-control bg-light border-0 px-4 py-3" name="mensagem" id="mensagem"
                                rows="4" placeholder="Conte um pouco sobre sua encomenda, data do evento, quantidade desejada ou sabores de interesse"
                                aria-label="Mensagem" required></textarea>
                        </div>

                        <!-- Botão enviar -->
                        <div class="col-sm-12">
                            <button class="btn btn-primary border-inner w-100 py-3" type="submit">
                                Enviar pelo WhatsApp
                            </button>
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
<!-- Fim Contato -->

<script>
    function enviarWhatsApp(event) {
        event.preventDefault();

        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const assunto = document.getElementById("assunto").value.trim();
        const mensagem = document.getElementById("mensagem").value.trim();

        const telefone = "5544999954447";

        const texto = `Olá, Florido Doces! Gostaria de fazer uma encomenda.%0A%0A` +
            `Nome: ${nome}%0A` +
            `E-mail: ${email || "Não informado"}%0A` +
            `Assunto: ${assunto}%0A` +
            `Mensagem: ${mensagem}`;

        const url = `https://wa.me/${telefone}?text=${texto}`;

        window.open(url, "_blank");
    }
</script>
