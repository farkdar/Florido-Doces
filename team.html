<!DOCTYPE html>
<!--
  Página "Contato" (contact) do site de confeitaria.
  Todo o conteúdo textual foi traduzido para pt-BR e
  os comentários explicam a função de cada bloco/linha.
-->
<html lang="pt-BR">

<head>
    <!-- Codificação do documento -->
    <meta charset="utf-8" />

    <!-- Título exibido na aba do navegador -->
    <title>Florido Doces</title>

    <!-- Viewport para layout responsivo em dispositivos móveis -->
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Metatags de SEO básicas (ajuste para o seu negócio real) -->
    <meta content="Confeitaria, Bolos, Doces, Sobre nós, Modelos HTML Gratuitos" name="keywords" />
    <meta content="Página 'Sobre Nós' de um template gratuito para confeitaria, responsivo e personalizável."
        name="description" />

    <!-- Favicon do site -->
    <link href="img/favicon.ico" rel="icon" />

    <!--
    Google Fonts:
    - Open Sans para textos
    - Oswald para títulos
    - Pacifico para detalhes/branding
    Preconnect melhora a performance ao antecipar conexões.
  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald:wght@500;600;700&family=Pacifico&display=swap"
        rel="stylesheet" />

    <!-- Bibliotecas de ícones: Font Awesome e Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- CSS de terceiros: Owl Carousel (se houver carrosséis nesta página/site) -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />

    <!-- Bootstrap (CSS) do tema -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />

    <!-- CSS principal do template: identidade visual e utilitários customizados -->
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <!-- ======================================
       NAVBAR — menu principal responsivo
       ======================================
       .navbar-expand-lg: expande o menu a partir de telas lg
       .bg-dark .navbar-dark: esquema de cores
  -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow-sm py-3 py-lg-0 px-3 px-lg-0">
        <!-- Marca alternativa visível apenas em mobile -->
       <a href="index.html" class="navbar-brand d-block d-lg-none" aria-label="Ir para Início">
    <img src="img/VARIAÇÃO CORES_1.png" alt="Florido Doces Navbar" class="logo-mobile">
</a>

        <!-- Botão hamburguer (abre/fecha o menu no mobile) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
            aria-controls="navbarCollapse" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Itens colapsáveis do menu -->
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto mx-lg-auto py-0">
                <a href="index.html" class="nav-item nav-link">Início</a>
                <!-- .active marca a página atual -->
                <a href="about.html" class="nav-item nav-link">Sobre Nós</a>
                <a href="menu.html" class="nav-item nav-link">Cardápio &amp; Preços</a>
                <a href="team.html" class="nav-item nav-link active" aria-current="page">Chefes</a>

                <!-- Dropdown "Páginas" 
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
                        aria-expanded="false">Páginas</a>
                    <div class="dropdown-menu m-0">
                        <a href="service.html" class="dropdown-item">Nossos Serviços</a>
                        <a href="testimonial.html" class="dropdown-item">Depoimentos</a>
                    </div>
                </div>-->

                <a href="contact.html" class="nav-item nav-link">Contato</a>
            </div>
        </div>
    </nav>
    <!-- Fim Navbar -->

    <!-- ==================================
       CABEÇALHO DA PÁGINA (hero interno)
       ==================================
       .bg-dark + .bg-img aplicam fundo escuro com imagem (ver style.css)
  -->
    <div class="container-fluid bg-dark bg-img p-5 mb-5">
        <div class="row">
            <div class="col-12 text-center">
                <!-- Título principal da página -->
                <h1 class="display-4 text-uppercase text-white">Chefes</h1>
            </div>
        </div>
    </div>
    <!-- Fim Cabeçalho -->


    <!-- ===================== EQUIPE (cards de chefs) ===================== -->
<div class="container-fluid py-5">
    <div class="container">
        <!-- Título da seção -->
        <div class="section-title position-relative text-center mx-auto mb-5 pb-3" style="max-width: 600px;">
            <h2 class="text-primary font-secondary">Membros do Time</h2>
            <h1 class="display-4 text-uppercase">Nossas Chefes</h1>
        </div>

        <div class="row g-5 justify-content-center">

            <!-- Card Chef 1 - Izabela -->
            <div class="col-lg-4 col-md-6">
                <div class="team-item">
                    <div class="position-relative overflow-hidden">
                        <img class="img-fluid w-100" src="img/teamm-2.png" alt="Foto da chefe Izabela Florido">

                        <div
                            class="team-overlay w-100 h-100 position-absolute top-50 start-50 translate-middle d-flex align-items-center justify-content-center">
                            <div class="d-flex align-items-center justify-content-center">
                                <a class="btn btn-lg btn-primary btn-lg-square border-inner rounded-0 mx-1"
                                    href="https://instagram.com/izaa_florido/" target="_blank" rel="noopener"
                                    aria-label="Instagram da Izabela Florido">
                                    <i class="fab fa-instagram fw-normal"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="bg-dark border-inner text-center p-4">
                        <h4 class="text-uppercase text-primary">Izabela Florido</h4>
                        <p class="text-white m-0">Chef Pâtissier</p>
                    </div>
                </div>
            </div>

            <!-- Card Chef 2 - Eduarda -->
            <div class="col-lg-4 col-md-6">
                <div class="team-item">
                    <div class="position-relative overflow-hidden">
                        <img class="img-fluid w-100" src="img/teamm-1.png" alt="Foto da chefe Eduarda Florido">

                        <div
                            class="team-overlay w-100 h-100 position-absolute top-50 start-50 translate-middle d-flex align-items-center justify-content-center">
                            <div class="d-flex align-items-center justify-content-center">
                                <a class="btn btn-lg btn-primary btn-lg-square border-inner rounded-0 mx-1"
                                    href="https://instagram.com/duda_florido/" target="_blank" rel="noopener"
                                    aria-label="Instagram da Eduarda Florido">
                                    <i class="fab fa-instagram fw-normal"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="bg-dark border-inner text-center p-4">
                        <h4 class="text-uppercase text-primary">Eduarda Florido</h4>
                        <p class="text-white m-0">Sous-Chef Pâtissier</p>
                    </div>
                </div>
            </div>

        </div><!-- /row -->
    </div>
</div>
<!-- ===================== /EQUIPE ===================== -->


    <!-- =======================
       RODAPÉ
       ======================= -->
    <div id="footer"></div>

    <script>
        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            })
            .catch(error => console.error("Erro ao carregar footer:", error));
    </script>


    <!-- Botão Voltar ao Topo -->
    <a href="#" class="btn btn-primary border-inner py-3 fs-4 back-to-top" aria-label="Voltar ao topo"><i
            class="bi bi-arrow-up"></i></a>


    <!-- Bibliotecas JavaScript (ordem importante: dependências antes do script principal) -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/counterup/counterup.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- JavaScript do template -->
    <script src="js/main.js"></script>
</body>

</html>
